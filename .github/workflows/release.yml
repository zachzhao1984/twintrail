name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The build reads the repository and uploads artifacts to a draft release,
# so it needs contents: write for that upload alone.
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds on macOS, which makes the disk image and signs the
          # app; mygo needs no cgo, so Windows and Linux build from a plain
          # runner each, where NSIS for the Windows setup is at hand.
          - name: macOS universal
            runs-on: macos-latest
            platforms: darwin/universal
            artifact: Twintrail-macOS
            paths: |
              build/*/*.dmg
          - name: Windows
            runs-on: windows-latest
            platforms: windows/amd64,windows/arm64
            artifact: Twintrail-Windows
            paths: |
              build/*/*.exe
              build/*/*.zip
          - name: Linux
            runs-on: ubuntu-latest
            platforms: linux/amd64,linux/arm64
            artifact: Twintrail-Linux
            paths: |
              build/*/*.tar.gz
              build/*/*.deb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # mygo.json has no toolchain field, so go.mod's directive is what
          # pins the Go the build runs on.
          go-version-file: go.mod

      # Skipped on workflow_dispatch, which has no tag to check.
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mygo.json, which says version $version."
            echo "::error::To release $GITHUB_REF_NAME, commit a mygo.json with version ${GITHUB_REF_NAME#v} and tag that commit."
            exit 1
          fi

      # One build, and only one, writes the output directory: mygo replaces
      # build/<goos>-<goarch> wholesale on every run, so a second build
      # deletes what the first left there.
      #
      # The macOS build makes the disk image and, when the signing key is
      # set, the archive, deltas and update manifest beside it, and -upload
      # then sends those to the draft release. It keeps the disk image on
      # disk, so the step after can still find it. Windows and Linux build
      # without -upload even when the key is set: one job would upload the
      # draft release the others then race, and the manifest of one platform
      # would tell the updater of every platform.
      #
      # mygo downloads libghostty-vt from a GitHub release asset on a cold
      # cache, and that redirect can fail with a transient EOF. Retry the
      # build a few times, but stop at the third failure and surface the
      # last error, so a real build failure is never masked.
      #
      # MYGO_UPDATER_PRIVATE_KEY is the repository secret holding the
      # signing key, base64 as mygo-update.key holds it. Without it mygo
      # still builds the disk image and skips the update files, and there
      # is nothing to upload, which is why -upload is added only when the
      # key is there: mygo would fail on "nothing to upload".
      - name: Build, and upload the update files when signed
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          upload=""
          if [ -z "${MYGO_UPDATER_PRIVATE_KEY:-}" ]; then
            echo "::warning::MYGO_UPDATER_PRIVATE_KEY is not set: building without the signed update files."
          elif [ "$RUNNER_OS" = "macOS" ]; then
            upload="-upload"
          fi
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt of 3"
            # shellcheck disable=SC2086
            if go tool mygo build --platform "${{ matrix.platforms }}" --skip-notarize $upload; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "::warning::Build attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::mygo build failed after 3 attempts; see the log above for the last error"
              exit 1
            fi
          done

      # Runs whether or not the build uploaded anything: the disk image is
      # made either way, and -upload leaves it in place.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
